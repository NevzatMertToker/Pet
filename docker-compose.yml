# Yerel geliştirme için PostgreSQL.
#   docker compose up -d
# Geliştirme veritabanı: patipaket · test veritabanı: patipaket_test
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patipaket
      POSTGRES_PASSWORD: patipaket
      POSTGRES_DB: patipaket
    ports:
      - "5432:5432"
    volumes:
      - patipaket-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patipaket -d patipaket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  patipaket-db:
